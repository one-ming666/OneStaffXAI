<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>One staff X AI · 多模态超级AI数字员工</title>
    <style>
      :root {
        --blue: #2f7bee;
        --blue-deep: #1b62d6;
        --navy: #0f2337;
        --muted: #5d6c78;
        --paper: #f7f9f9;
        --ease: cubic-bezier(0.16, 0.84, 0.3, 1);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--paper);
        color: var(--navy);
        font-family:
          "HarmonyOS Sans SC",
          "PingFang SC",
          "Hiragino Sans GB",
          "Source Han Sans SC",
          "Noto Sans SC",
          "Microsoft YaHei",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Inter,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      #grid {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
      }

      .wash {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          radial-gradient(115% 80% at 52% 44%, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 58%),
          radial-gradient(62% 50% at 6% 33%, rgba(255, 206, 183, 0.16) 0%, rgba(255, 206, 183, 0) 72%),
          radial-gradient(85% 65% at 97% 90%, rgba(190, 211, 245, 0.2) 0%, rgba(190, 211, 245, 0) 72%);
      }

      .stage {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(28px, 6vw, 80px) clamp(20px, 5vw, 64px);
      }

      .hero {
        width: min(1080px, 100%);
        text-align: center;
      }

      .l1,
      .l2,
      .l3 {
        margin: 0;
        line-height: 1.18;
      }

      .l1 {
        font-family: "Source Han Serif SC", "Noto Serif SC", "Source Han Serif", SimSun, serif;
        font-size: clamp(42px, 8.6vw, 104px);
        font-weight: 900;
        letter-spacing: -0.02em;
        color: var(--blue-deep);
        animation: rise 0.9s var(--ease) 0.05s both;
      }

      .l2 {
        margin-top: clamp(6px, 1vw, 14px);
        font-size: clamp(29px, 5.9vw, 74px);
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #182b42;
        animation: rise 0.9s var(--ease) 0.17s both;
      }

      .l3 {
        margin-top: clamp(14px, 1.9vw, 24px);
        font-size: clamp(14px, 2.3vw, 28px);
        font-weight: 600;
        letter-spacing: 0.14em;
        color: #2c3a4f;
        animation: rise 0.9s var(--ease) 0.29s both;
      }

      @supports ((background-clip: text) or (-webkit-background-clip: text)) {
        .l1 {
          background-image: linear-gradient(180deg, #6fb0ff 0%, #2f7bee 45%, #1b62d6 100%);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
        }

        .l2 {
          background-image: linear-gradient(
            90deg,
            #172033 0%,
            #4b86f7 25%,
            #9a70ff 50%,
            #4b86f7 75%,
            #172033 100%
          );
          background-size: 200% 100%;
          background-repeat: repeat;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
          animation:
            rise 0.9s var(--ease) 0.17s both,
            gradientFlow 5.6s linear infinite 1.2s;
        }

        .l3 {
          background-image: linear-gradient(
            90deg,
            #2c3a4f 0%,
            #4b86f7 25%,
            #8363ff 50%,
            #4b86f7 75%,
            #2c3a4f 100%
          );
          background-size: 200% 100%;
          background-repeat: repeat;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          -webkit-text-fill-color: transparent;
          animation:
            rise 0.9s var(--ease) 0.29s both,
            gradientFlow 6.2s linear infinite 1.3s;
        }
      }

      @keyframes gradientFlow {
        from {
          background-position: 0% 0;
        }
        to {
          background-position: -200% 0;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .tag {
        margin: clamp(20px, 2.8vw, 32px) 0 0;
        font-size: clamp(13px, 1.5vw, 17px);
        font-weight: 500;
        letter-spacing: 0.2em;
        color: var(--muted);
        animation: rise 0.9s var(--ease) 0.41s both;
      }

      .go {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        margin-top: clamp(26px, 3.4vw, 40px);
        padding: clamp(13px, 1.5vw, 17px) clamp(24px, 3vw, 34px);
        border: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, #4189f4 0%, var(--blue) 50%, var(--blue-deep) 100%);
        color: #fff;
        font-family: inherit;
        font-size: clamp(15px, 1.6vw, 18px);
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        box-shadow:
          0 12px 28px rgba(47, 123, 238, 0.3),
          0 2px 5px rgba(20, 60, 130, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.28);
        animation: rise 0.9s var(--ease) 0.53s both;
        transition:
          box-shadow 0.24s ease,
          filter 0.24s ease;
      }

      .go span {
        display: inline-flex;
        transition: transform 0.24s var(--ease);
      }
      .go:hover {
        box-shadow:
          0 18px 38px rgba(47, 123, 238, 0.38),
          0 3px 7px rgba(20, 60, 130, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        filter: saturate(1.06) brightness(1.03);
      }
      .go:hover span {
        transform: translateX(5px);
      }
      .go:active {
        box-shadow:
          0 8px 16px rgba(47, 123, 238, 0.26),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
      .go:focus-visible {
        outline: 3px solid var(--navy);
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        .l1,
        .l2,
        .l3,
        .tag,
        .go {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
          background-position: 0 0 !important;
        }
        .go span {
          transition: none;
        }
      }
    </style>
    <style>
      #nebula {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 30;
        pointer-events: none;
        display: none;
      }
      #lockFrame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        z-index: 20;
        background: #edf5ff;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s;
      }
      body.in-lock #lockFrame {
        opacity: 1;
        pointer-events: auto;
      }
      body.in-lock > .stage,
      body.in-lock > .wash,
      body.in-lock > #grid {
        visibility: hidden;
      }
      body.transit .hero {
        visibility: hidden;
      }
    </style>
    <style>
      .logo-heading {
        line-height: 0;
        background: none !important;
        -webkit-text-fill-color: initial !important;
        margin: 0 auto 6px;
        width: min(660px, 84vw);
      }
      .logo-heading .brand-image {
        display: block;
        width: 100%;
        height: auto;
      }
      .hero .l2 {
        font-size: clamp(27px, 5vw, 64px);
      }
      .hero .l3 {
        font-size: clamp(13px, 2vw, 25px);
      }
    </style>

    <script>
      (function () {
        var cv = document.getElementById("grid");
        var ctx = cv.getContext("2d", {
          alpha: false,
        });
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var W = 0,
          H = 0,
          DPR = 1,
          S = 96,
          RH = 83;
        var COLS = 0,
          ROWS = 0,
          OX = 0,
          OY = 0,
          maxR = 1;
        var VX = null,
          VY = null,
          VZ = null;
        var pulses = [];
        var t0 = performance.now();
        var centerX = 0;
        var centerY = 0;
        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          cv.width = Math.round(W * DPR);
          cv.height = Math.round(H * DPR);
          cv.style.width = W + "px";
          cv.style.height = H + "px";
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          S = Math.max(54, Math.min(108, W / 13));
          RH = S * 0.8660254;
          OX = -S * 1.5;
          OY = -RH * 2;
          COLS = Math.ceil((W - OX) / S) + 2;
          ROWS = Math.ceil((H - OY) / RH) + 3;
          var n = (COLS + 1) * (ROWS + 1);
          VX = new Float32Array(n);
          VY = new Float32Array(n);
          VZ = new Float32Array(n);
          for (var j = 0; j <= ROWS; j++) {
            for (var i = 0; i <= COLS; i++) {
              var k = j * (COLS + 1) + i;
              VX[k] = OX + i * S + (j & 1 ? S * 0.5 : 0);
              VY[k] = OY + j * RH;
            }
          }
          maxR = Math.sqrt(W * W + H * H) * 0.5;
          centerX = W / 2;
          centerY = H / 2;
        }
        function addPulse(x, y) {
          if (reduce) return;
          pulses.push({
            x: x,
            y: y,
            t: (performance.now() - t0) / 1000,
          });
          if (pulses.length > 8) pulses.shift();
        }
        function height(x, y, t) {
          var dx = x - centerX;
          var dy = y - centerY;
          var d = Math.sqrt(dx * dx + dy * dy);
          var breath = Math.sin(t * 0.85) * 0.72;
          var falloff = Math.exp(-Math.pow(d / (maxR * 0.52), 2));
          var h = breath * falloff;
          h += 0.12 * Math.sin(x * 0.0052 + t * 0.35) * Math.cos(y * 0.0062 - t * 0.28);
          h += 0.1 * Math.sin((x + y) * 0.0041 - t * 0.5);
          h += 0.08 * Math.cos(d * 0.0095 - t * 0.72);
          for (var p = 0; p < pulses.length; p++) {
            var pu = pulses[p];
            var age = t - pu.t;
            if (age < 0 || age > 3.6) continue;
            var pd = Math.sqrt((x - pu.x) * (x - pu.x) + (y - pu.y) * (y - pu.y));
            var fr = age * 620;
            h +=
              1.55 *
              Math.exp(-Math.pow((pd - fr) / 240, 2)) *
              Math.exp(-age * 0.95) *
              Math.sin((pd - fr) * 0.015);
          }
          return h;
        }
        function tone(x, y) {
          var nx = x / W;
          var ny = y / H;
          var dx = (nx - 0.6) * 1.05;
          var dy = (ny - 0.42) * 0.92;
          var d = Math.sqrt(dx * dx + dy * dy);
          var v = 249 - 15 * Math.min(1, Math.max(0, (d - 0.26) / 0.62));
          return v - 3.5 * Math.max(0, 1 - nx / 0.3);
        }
        var LX = -0.44,
          LY = -0.56,
          LZ = 0.7;
        var LN = Math.sqrt(LX * LX + LY * LY + LZ * LZ);
        LX /= LN;
        LY /= LN;
        LZ /= LN;
        function face(a, b, c, amp) {
          var x1 = VX[a],
            y1 = VY[a],
            z1 = VZ[a] * amp;
          var x2 = VX[b],
            y2 = VY[b],
            z2 = VZ[b] * amp;
          var x3 = VX[c],
            y3 = VY[c],
            z3 = VZ[c] * amp;
          var ux = x2 - x1,
            uy = y2 - y1,
            uz = z2 - z1;
          var vx = x3 - x1,
            vy = y3 - y1,
            vz = z3 - z1;
          var nx = uy * vz - uz * vy;
          var ny = uz * vx - ux * vz;
          var nz = ux * vy - uy * vx;
          if (nz < 0) {
            nx = -nx;
            ny = -ny;
            nz = -nz;
          }
          var lam = (nx * LX + ny * LY + nz * LZ) / (Math.sqrt(nx * nx + ny * ny + nz * nz) || 1);
          var zm = (VZ[a] + VZ[b] + VZ[c]) / 3;
          var e = zm < 0 ? 0 : zm > 1 ? 1 : zm;
          e *= 0.76 + 0.46 * (((a * 97 + b * 57) % 211) / 211);
          if (e > 1) e = 1;
          var v = tone((x1 + x2 + x3) / 3, (y1 + y2 + y3) / 3);
          var k = e * 0.55;
          var r = v - 2 + (176 - (v - 2)) * k;
          var g = v + (200 - v) * k;
          var bl = v + (240 - v) * k;
          var sh = 0.93 + 0.17 * lam;
          ctx.fillStyle = "rgb(" + ((r * sh) | 0) + "," + ((g * sh) | 0) + "," + ((bl * sh) | 0) + ")";
          ctx.beginPath();
          ctx.moveTo(x1, y1 - z1);
          ctx.lineTo(x2, y2 - z2);
          ctx.lineTo(x3, y3 - z3);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "rgba(40,86,150," + (0.05 + 0.14 * e).toFixed(3) + ")";
          ctx.stroke();
        }
        function draw(now) {
          var t = reduce ? 3.6 : (now - t0) / 1000;
          var amp = S * 0.82;
          for (var j = 0; j <= ROWS; j++) {
            for (var i = 0; i <= COLS; i++) {
              var k = j * (COLS + 1) + i;
              VZ[k] = height(VX[k], VY[k], t);
            }
          }
          ctx.fillStyle = "#f7f9f9";
          ctx.fillRect(0, 0, W, H);
          ctx.lineJoin = "round";
          ctx.lineWidth = 1;
          for (var jj = 0; jj < ROWS; jj++) {
            var odd = jj & 1;
            var row = jj * (COLS + 1);
            var nrow = (jj + 1) * (COLS + 1);
            for (var ii = 0; ii < COLS; ii++) {
              face(row + ii, row + ii + 1, nrow + ii + (odd ? 1 : 0), amp);
              face(row + ii + (odd ? 0 : 1), nrow + ii, nrow + ii + 1, amp);
            }
          }
          if (!reduce) requestAnimationFrame(draw);
        }
        var rt;
        window.addEventListener("resize", function () {
          clearTimeout(rt);
          rt = setTimeout(function () {
            resize();
            if (reduce) requestAnimationFrame(draw);
          }, 120);
        });
        document.addEventListener("mousedown", function (e) {
          addPulse(e.clientX, e.clientY);
        });
        var mouseTimer = null;
        document.addEventListener("mousemove", function (e) {
          clearTimeout(mouseTimer);
          mouseTimer = setTimeout(function () {
            addPulse(e.clientX, e.clientY);
          }, 140);
        });
        document.addEventListener(
          "touchstart",
          function (e) {
            var touch = e.touches[0];
            if (!touch) return;
            addPulse(touch.clientX, touch.clientY);
          },
          {
            passive: true,
          },
        );
        document.getElementById("go").addEventListener("click", function (ev) {
          ev.stopPropagation();
          var r = ev.currentTarget.getBoundingClientRect();
          addPulse(r.left + r.width / 2, r.top + r.height / 2);
        });
        resize();
        requestAnimationFrame(draw);
      })();
    </script>

    <script>
      (() => {
        const cv = document.querySelector("#nebula"),
          c = cv.getContext("2d"),
          frame = document.querySelector("#lockFrame");
        frame.src = "/unlock.html";
        let busy = false,
          w,
          h,
          fragments = [],
          start = 0,
          raf,
          cloud;
        const clamp = (v) => Math.max(0, Math.min(1, v)),
          smooth = (v) => {
            v = clamp(v);
            return v * v * (3 - 2 * v);
          };
        function hash(x, y) {
          const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
          return v - Math.floor(v);
        }
        function noise(x, y) {
          const i = Math.floor(x),
            j = Math.floor(y),
            u = smooth(x - i),
            v = smooth(y - j);
          return (
            (hash(i, j) * (1 - u) + hash(i + 1, j) * u) * (1 - v) +
            (hash(i, j + 1) * (1 - u) + hash(i + 1, j + 1) * u) * v
          );
        }
        function fbm(x, y) {
          let f = 0,
            a = 0.5;
          for (let k = 0; k < 5; k++) {
            f += a * noise(x, y);
            x = x * 2.03 + 13;
            y = y * 2.03 + 7;
            a *= 0.5;
          }
          return f;
        }
        function makeCloud() {
          const n = 650,
            t = document.createElement("canvas");
          t.width = t.height = n;
          const q = t.getContext("2d"),
            im = q.createImageData(n, n);
          for (let y = 0; y < n; y++)
            for (let x = 0; x < n; x++) {
              const nx = (x - n / 2) / (n / 2),
                ny = (y - n / 2) / (n / 2),
                r = Math.hypot(nx, ny),
                a = Math.atan2(ny, nx);
              const turbulence = fbm(nx * 6 + 24, ny * 6 + 18),
                warp = fbm(nx * 3 + 80, ny * 3 + 20);
              const spiral = Math.pow(0.5 + 0.5 * Math.sin(a * 3 + r * 13 + warp * 6), 3);
              let density =
                Math.pow(turbulence, 1.6) *
                (0.22 + spiral * 1.9) *
                Math.exp(-r * r * 2.8) *
                smooth((1 - r) * 4);
              const dust = Math.pow(fbm(nx * 14 + 90, ny * 14 + 70), 2);
              density *= 1 - dust * 0.85;
              const core = Math.exp(-r * r * 150);
              const i = (y * n + x) * 4;
              im.data[i] = Math.min(255, 50 + density * 130 + core * 190);
              im.data[i + 1] = Math.min(255, 83 + density * 175 + core * 175);
              im.data[i + 2] = Math.min(255, 165 + density * 155 + core * 110);
              im.data[i + 3] = Math.min(255, (density * 2 + core) * 255);
            }
          q.putImageData(im, 0, 0);
          return t;
        }
        const stars = Array.from(
          {
            length: 1000,
          },
          () => ({
            a: Math.random() * Math.PI * 2,
            r: Math.random(),
            z: Math.random(),
            size: Math.random() * 1.4 + 0.3,
          }),
        );
        function collect() {
          fragments = [];
          const logo = document.querySelector(".logo-heading img"),
            box = logo.getBoundingClientRect();
          for (let yy = 0; yy < 5; yy++)
            for (let xx = 0; xx < 24; xx++)
              fragments.push({
                image: logo,
                sx: (xx * logo.naturalWidth) / 24,
                sy: (yy * logo.naturalHeight) / 5,
                sw: logo.naturalWidth / 24,
                sh: logo.naturalHeight / 5,
                x: box.left + ((xx + 0.5) * box.width) / 24,
                y: box.top + ((yy + 0.5) * box.height) / 5,
                width: box.width / 24,
                height: box.height / 5,
                delay: Math.random() * 0.45,
                angle: Math.random() * 2 - 1,
              });
          document.querySelectorAll(".l1,.l2,.l3,.tag,#go").forEach((el) => {
            const style = getComputedStyle(el),
              walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
            let node;
            while ((node = walker.nextNode())) {
              for (let i = 0; i < node.length; i++) {
                if (!node.textContent[i].trim()) continue;
                const range = document.createRange();
                range.setStart(node, i);
                range.setEnd(node, i + 1);
                const r = range.getBoundingClientRect();
                fragments.push({
                  text: node.textContent[i],
                  x: r.left + r.width / 2,
                  y: r.top + r.height / 2,
                  font: style.font,
                  size: parseFloat(style.fontSize),
                  color: el.id === "go" ? "#a9d8ff" : el.classList.contains("l1") ? "#74b8ff" : "#c2dcff",
                  delay: Math.random() * 0.45,
                  angle: Math.random() * 2 - 1,
                });
              }
            }
          });
        }
        function finish() {
          busy = false;
          cancelAnimationFrame(raf);
          cv.style.display = "none";
          document.body.classList.add("in-lock");
          document.querySelector(".stage").inert = true;
          frame.inert = false;
          setTimeout(() => {
            try {
              frame.contentWindow.focus();
            } catch {}
          }, 80);
        }
        function render(now) {
          const t = (now - start) / 1000;
          c.clearRect(0, 0, w, h);
          const fadeIn = smooth(t / 0.85),
            reveal = smooth((t - 3.9) / 1.05);
          c.fillStyle = `rgba(3,7,24,${fadeIn * (1 - reveal)})`;
          c.fillRect(0, 0, w, h);
          const cx = w * 0.5,
            cy = h * 0.48;
          const size = Math.min(w, h) * (1.1 + smooth(t / 2) * 0.3 + smooth((t - 3.3) / 1.1) * 2.7);
          c.save();
          c.globalAlpha = fadeIn * (1 - reveal);
          c.translate(cx, cy);
          c.rotate(t * 0.19 - 0.35);
          c.scale(1, 0.77);
          c.globalCompositeOperation = "screen";
          c.drawImage(cloud, -size / 2, -size / 2, size, size);
          c.rotate(-t * 0.31);
          c.globalAlpha *= 0.36;
          c.drawImage(cloud, -size * 0.57, -size * 0.57, size * 1.14, size * 1.14);
          c.restore();
          c.save();
          c.globalCompositeOperation = "screen";
          for (const s of stars) {
            const a = s.a + t * (0.035 + s.z * 0.05),
              r = s.r * Math.hypot(w, h) * 0.62;
            const x = cx + Math.cos(a) * r,
              y = cy + Math.sin(a) * r * 0.7;
            c.globalAlpha = fadeIn * (1 - reveal) * (0.25 + s.z * 0.75);
            c.fillStyle = "#c9dfff";
            c.beginPath();
            c.arc(x, y, s.size, 0, 7);
            c.fill();
          }
          c.restore();
          for (const f of fragments) {
            const p = clamp((t - 0.3 - f.delay) / 2.8),
              ease = p * p;
            const dx = f.x - cx,
              dy = f.y - cy,
              r = Math.hypot(dx, dy) * (1 - ease),
              a = Math.atan2(dy, dx) + Math.pow(p, 2) * Math.PI * 2.3;
            const x = cx + Math.cos(a) * r,
              y = cy + Math.sin(a) * r;
            c.save();
            c.translate(x, y);
            c.rotate(f.angle * p + p * 3);
            c.scale(Math.max(0.02, 1 - p * 0.97), Math.max(0.02, 1 - p * 0.97));
            c.globalAlpha = (1 - smooth((p - 0.8) / 0.2)) * (1 - reveal);
            c.shadowBlur = p * 15;
            c.shadowColor = "#7cafff";
            if (f.image) {
              c.drawImage(f.image, f.sx, f.sy, f.sw, f.sh, -f.width / 2, -f.height / 2, f.width, f.height);
            } else {
              c.font = f.font;
              c.textAlign = "center";
              c.textBaseline = "middle";
              c.fillStyle = f.color;
              c.fillText(f.text, 0, 0);
            }
            c.restore();
            if (p > 0.12 && p < 0.96) {
              c.strokeStyle = `rgba(98,166,255,${(1 - p) * 0.22})`;
              c.beginPath();
              c.moveTo(x, y);
              c.lineTo(x + Math.sin(a) * p * 34, y - Math.cos(a) * p * 34);
              c.stroke();
            }
          }
          if (t > 3.35) {
            const glow = smooth((t - 3.35) / 0.65) * (1 - reveal),
              radius = Math.max(1, size * 0.5);
            const g = c.createRadialGradient(cx, cy, 0, cx, cy, radius);
            g.addColorStop(0, `rgba(234,245,255,${glow})`);
            g.addColorStop(0.17, `rgba(98,177,255,${glow * 0.65})`);
            g.addColorStop(1, "rgba(98,177,255,0)");
            c.fillStyle = g;
            c.fillRect(0, 0, w, h);
          }
          if (t > 3.9) {
            document.body.classList.add("in-lock");
            frame.inert = false;
          }
          if (t < 5.05) raf = requestAnimationFrame(render);
          else finish();
        }
        document.querySelector("#go").addEventListener("click", () => {
          if (busy) return;
          busy = true;
          if (matchMedia("(prefers-reduced-motion:reduce)").matches) {
            finish();
            return;
          }
          w = innerWidth;
          h = innerHeight;
          const dpr = Math.min(devicePixelRatio, 1.5);
          cv.width = w * dpr;
          cv.height = h * dpr;
          c.setTransform(dpr, 0, 0, dpr, 0, 0);
          collect();
          cloud = cloud || makeCloud();
          document.body.classList.add("transit");
          document.querySelector(".stage").inert = true;
          cv.style.display = "block";
          start = performance.now();
          raf = requestAnimationFrame(render);
        });
        window.addEventListener("message", (e) => {
          if (e.source !== frame.contentWindow || e.data !== "onestaff:home") return;
          cancelAnimationFrame(raf);
          busy = false;
          cv.style.display = "none";
          document.body.classList.remove("in-lock", "transit");
          frame.inert = true;
          document.querySelector(".stage").inert = false;
          document.querySelector("#go").focus();
        });
        window.addEventListener("resize", () => {
          if (busy) {
            cancelAnimationFrame(raf);
            finish();
          }
        });
      })();
    </script>
